# Reddit communities (fetched via public .rss, no API key). Link posts resolve
# to the linked article; self posts keep the post body as the text.
reddit:
  - artificial
  - MachineLearning
  - LocalLLaMA
  - singularity
  - OpenAI
  - ClaudeAI
  - ArtificialInteligence
  - ChatGPT

# Hacker News (Algolia search API, no key). Stories from the last window whose
# title/URL matches one of these queries AND passes the AI relevance filter.
hackernews:
  min_points: 10
  queries: ["AI", "LLM", "OpenAI", "Anthropic", "Claude", "GPT", "Gemini", "machine learning",
            "artificial intelligence", "language model", "chatbot", "AI agents", "Nvidia", "DeepSeek", "Hugging Face"]

# GDELT DOC 2.0 (no key). Mainstream + international coverage from 65k+ outlets.
# One request every 6 s to stay under the (unofficial) rate limit.
gdelt:
  queries:
    - '("artificial intelligence" OR "AI model" OR "AI models" OR "generative AI") sourcelang:english'
    - '(OpenAI OR Anthropic OR ChatGPT OR "Google DeepMind" OR "Gemini AI") sourcelang:english'
    - '("large language model" OR "large language models" OR "AI chatbot" OR "AI agents" OR "AI regulation") sourcelang:english'
  max_records: 250
  # Press-release wires and aggregators that swamp the signal.
  exclude_domains:
    - prnewswire.com
    - globenewswire.com
    - businesswire.com
    - einpresswire.com
    - openpr.com
    - marketscreener.com
    - newswire.ca
    - accesswire.com
    - prweb.com
    - yahoo.com
    - msn.com
    - streetinsider.com
    - benzinga.com
    - marketbeat.com
    - investing.com
    - tipranks.com
    - fool.com
    - zacks.com
    - seekingalpha.com
