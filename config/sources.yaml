# Source registry for the AI news discourse dataset.
#
# Every entry becomes `source` / `source_type` metadata on the articles it
# yields. Fields:
#   name         display name of the publisher (metadata: source)
#   url          RSS/Atom feed URL
#   type         mainstream_news | tech_press | company_blog | newsletter |
#                research | policy | community   (metadata: source_type)
#   ai_specific  true  -> every item is taken
#                false -> items must pass the AI relevance filter
#   paywalled    true  -> do not try to fetch full text, keep the feed summary
#   enabled      false -> skipped (kept here for the record)
#
# Verified reachable on 2026-10-13. Feeds that 404/403/410 that day are
# listed at the bottom, disabled, so they can be re-tried later.

feeds:
