name: Debug GDELT (temporary)
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          probe() { echo "=== $1"; curl -sS -m 40 -G "https://api.gdeltproject.org/api/v2/doc/doc" "${@:2}" | head -c 700; echo; sleep 9; }
          probe A --data-urlencode 'query="artificial intelligence"' --data-urlencode mode=artlist --data-urlencode maxrecords=3 --data-urlencode timespan=1d --data-urlencode format=json
          probe B --data-urlencode 'query="artificial intelligence" sourcelang:english' --data-urlencode mode=artlist --data-urlencode maxrecords=3 --data-urlencode timespan=1d --data-urlencode format=json
          probe C --data-urlencode 'query=("artificial intelligence" OR OpenAI) sourcelang:english' --data-urlencode mode=artlist --data-urlencode maxrecords=3 --data-urlencode timespan=1d --data-urlencode format=json
          probe D --data-urlencode 'query=("artificial intelligence" OR "AI model") sourcelang:english' --data-urlencode mode=artlist --data-urlencode maxrecords=3 --data-urlencode startdatetime=20261012000000 --data-urlencode enddatetime=20261013000000 --data-urlencode format=json
          probe E --data-urlencode 'query="artificial intelligence" sourcelang:english' --data-urlencode mode=artlist --data-urlencode maxrecords=3 --data-urlencode startdatetime=20261012000000 --data-urlencode enddatetime=20261013000000 --data-urlencode format=json --data-urlencode sort=datedesc
          probe F --data-urlencode 'query=("artificial intelligence" OR "AI model" OR "AI models" OR "generative AI") sourcelang:english' --data-urlencode mode=artlist --data-urlencode maxrecords=3 --data-urlencode timespan=1d --data-urlencode format=json
